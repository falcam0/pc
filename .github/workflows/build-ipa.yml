name: Build IPA

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Installa XcodeGen
        run: brew install xcodegen

      - name: Genera il progetto Xcode
        working-directory: ios-app
        run: xcodegen generate

      - name: Compila (senza firma)
        working-directory: ios-app
        run: |
          xcodebuild \
            -project PCRemote.xcodeproj \
            -scheme PCRemote \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            build

      - name: Crea l'IPA
        working-directory: ios-app
        run: |
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/PCRemote.app Payload/
          zip -qr PCRemote.ipa Payload

      - uses: actions/upload-artifact@v4
        with:
          name: PCRemote-ipa
          path: ios-app/PCRemote.ipa
